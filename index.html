<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; }
        textarea, select, button { width: 100%; margin-top: 10px; padding: 12px; border-radius: 8px; border: none; box-sizing: border-box; }
        textarea { height: 100px; font-size: 16px; }
        button { background: #38bdf8; color: black; font-weight: bold; cursor: pointer; font-size: 16px; }
        #output { margin-top: 20px; text-align: left; background: #0f172a; padding: 15px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; min-height: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎬 AI Video Generator</h2>
        <textarea id="userPrompt" placeholder="अपना Topic लिखें..."></textarea>
        
        <select id="duration">
            <option value="1">1 Minute</option>
            <option value="3">3 Minutes</option>
        </select>

        <select id="language">
            <option value="Hindi">Hindi</option>
            <option value="English">English</option>
        </select>

        <button onclick="generateScript()">🚀 Generate Video</button>

        <div id="output">आपकी AI स्क्रिप्ट यहाँ दिखेगी...</div>
    </div>

    <script>
        async function generateScript() {
            const prompt = document.getElementById('userPrompt').value;
            const duration = document.getElementById('duration').value;
            const language = document.getElementById('language').value;
            const output = document.getElementById('output');

            if (!prompt.trim()) {
                alert("कृपया पहले कोई Topic लिखें!");
                return;
            }

            output.innerText = "⏳ AI से स्क्रिप्ट जनरेट हो रही है, थोड़ा इंतज़ार करें...";

            const systemPrompt = `You are an expert YouTube video script writer. Write a ${duration}-minute video script in ${language} language. Topic: ${prompt}. Format with Scenes and Dialogues.`;

            try {
                // Free direct AI endpoint
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(systemPrompt)}?seed=${Math.floor(Math.random() * 1000)}&system=You+are+a+helpful+assistant`);
                const scriptText = await response.text();

                if (scriptText && !scriptText.includes("402 Payment Required")) {
                    output.innerText = scriptText;
                } else {
                    // Alternative Backup API (Inference Engine)
                    const backupRes = await fetch("https://backend.buildt.ai/api/generate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ prompt: systemPrompt })
                    });
                    const backupData = await backupRes.json();
                    output.innerText = backupData.response || backupData.text || "❌ जनरेट नहीं हो सका, पुनः प्रयास करें।";
                }
            } catch (error) {
                output.innerText = "❌ नेटवर्क कनेक्शन चेक करें।";
                console.error(error);
            }
        }
    </script>
</body>
</html>
