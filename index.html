<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; }
        input, textarea, select, button { width: 100%; margin-top: 10px; padding: 12px; border-radius: 8px; border: none; box-sizing: border-box; }
        textarea { height: 100px; font-size: 15px; }
        input { font-size: 14px; background: #334155; color: white; }
        button { background: #38bdf8; color: black; font-weight: bold; cursor: pointer; font-size: 16px; }
        #output { margin-top: 20px; text-align: left; background: #0f172a; padding: 15px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; min-height: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎬 AI Video Generator</h2>
        
        <input type="password" id="userApiKey" placeholder="यहाँ Google AI Studio API Key पेस्ट करें (AIzaSy...)">
        
        <textarea id="userPrompt" placeholder="अपना Topic लिखें..."></textarea>
        
        <select id="duration">
            <option value="1">1 Minute</option>
            <option value="3">3 Minutes</option>
        </select>

        <select id="language">
            <option value="Hindi">Hindi</option>
            <option value="English">English</option>
        </select>

        <button onclick="generateScript()">🚀 Generate Video</button>

        <div id="output">आपकी AI स्क्रिप्ट यहाँ दिखेगी...</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem("gemini_key");
            if(savedKey) document.getElementById('userApiKey').value = savedKey;
        });

        async function generateScript() {
            const apiKey = document.getElementById('userApiKey').value.trim();
            const prompt = document.getElementById('userPrompt').value;
            const duration = document.getElementById('duration').value;
            const language = document.getElementById('language').value;
            const output = document.getElementById('output');

            if (!apiKey) {
                alert("कृपया पहले अपनी Google AI Studio API Key डालें!");
                return;
            }

            if (!prompt.trim()) {
                alert("कृपया पहले कोई Topic लिखें!");
                return;
            }

            localStorage.setItem("gemini_key", apiKey);
            output.innerText = "⏳ AI से स्क्रिप्ट जनरेट हो रही है, थोड़ा इंतज़ार करें...";

            const systemPrompt = `आप एक एक्सपर्ट यूट्यूब वीडियो स्क्रिप्ट राइटर हैं। कृपया इस टॉपिक पर ${duration} मिनट की वीडियो स्क्रिप्ट ${language} भाषा में लिखें। इसे Scenes और Dialogue में बाँटें:\n\nTopic: ${prompt}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: systemPrompt }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    output.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    output.innerText = "❌ गलत API Key या सर्वर एरर। कृपया AI Studio से सही Key डालकर देखें।";
                }
            } catch (error) {
                output.innerText = "❌ नेटवर्क एरर। कृपया दोबारा कोशिश करें।";
                console.error(error);
            }
        }
    </script>
</body>
</html>
